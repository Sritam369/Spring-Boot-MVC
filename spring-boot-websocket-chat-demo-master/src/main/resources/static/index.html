<!DOCTYPE html>

<html>

<head>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0">


<title>CONNECTO - Real Time Secure Chat</title>

<link rel="stylesheet" href="/css/main.css" />


</head>

<body>

<noscript>
    <h2>Sorry! Your browser doesn't support Javascript</h2>
</noscript>

<!-- LOGIN PAGE -->

<div id="username-page">


<div class="username-page-container">

    <h1 class="title">
        CONNECTO
    </h1>

    <h3>
        Secure Real-Time Chat Application
    </h3>

    <form id="usernameForm">

        <div class="form-group">
            <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="off"
                    class="form-control"/>
        </div>

        <div class="form-group">
            <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    class="form-control"/>
        </div>

        <div class="form-group">

            <button
                    type="button"
                    id="registerBtn"
                    class="accent username-submit">

                Register

            </button>

            <button
                    type="submit"
                    class="accent username-submit">

                Login & Start Chatting

            </button>

        </div>

    </form>

</div>


</div>

<!-- CHAT PAGE -->

<div id="chat-page" class="hidden">


<div class="chat-container">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:15px;
        background:#f5f5f5;
        border-bottom:1px solid #ddd;">

        <h2 style="margin:0;">
            CONNECTO - Secure Chat
        </h2>

        <button
            id="logoutBtn"
            style="
                background:#dc3545;
                color:white;
                border:none;
                padding:10px 20px;
                border-radius:5px;
                cursor:pointer;
                font-weight:bold;">

            Logout

        </button>

    </div>

    <div class="connecting">
        Connecting...
    </div>

    <ul id="messageArea"></ul>

    <form id="messageForm">

        <div class="form-group">

            <div class="input-group clearfix">

                <input
                    type="text"
                    id="message"
                    placeholder="Type a message..."
                    autocomplete="off"
                    class="form-control"/>

                <button
                    type="submit"
                    class="primary">

                    Send

                </button>

            </div>

        </div>

    </form>

</div>


</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script src="/js/main.js"></script>

</body>
</html>
